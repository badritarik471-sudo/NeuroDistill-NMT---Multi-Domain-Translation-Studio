<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#083344"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#0ea5e9" stroke-width="6" stroke-opacity="0.3"/>

  <!-- Neural Network & Strategic Synthesis Symbol -->
  <g transform="translate(256, 256)">
    <!-- Outer Orbit Rings -->
    <circle r="140" fill="none" stroke="#1e293b" stroke-width="4" stroke-dasharray="8 8"/>
    <circle r="90" fill="none" stroke="#0284c7" stroke-width="2" stroke-opacity="0.4"/>

    <!-- Synapses Lines -->
    <line x1="0" y1="0" x2="-80" y2="-80" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.8"/>
    <line x1="0" y1="0" x2="80" y2="-80" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.8"/>
    <line x1="0" y1="0" x2="-100" y2="40" stroke="#34d399" stroke-width="4" stroke-opacity="0.8"/>
    <line x1="0" y1="0" x2="100" y2="40" stroke="#34d399" stroke-width="4" stroke-opacity="0.8"/>
    <line x1="0" y1="0" x2="0" y2="110" stroke="#818cf8" stroke-width="4" stroke-opacity="0.8"/>

    <!-- 5 Peripheral Nodes (5 Modules) -->
    <circle cx="-80" cy="-80" r="22" fill="#0369a1" stroke="#38bdf8" stroke-width="4"/>
    <circle cx="80" cy="-80" r="22" fill="#0369a1" stroke="#38bdf8" stroke-width="4"/>
    <circle cx="-100" cy="40" r="22" fill="#065f46" stroke="#34d399" stroke-width="4"/>
    <circle cx="100" cy="40" r="22" fill="#065f46" stroke="#34d399" stroke-width="4"/>
    <circle cx="0" cy="110" r="22" fill="#3730a3" stroke="#818cf8" stroke-width="4"/>

    <!-- Central Decision Node (Lead Strategy Partner) -->
    <circle cx="0" cy="0" r="36" fill="url(#cyanGrad)" stroke="#ffffff" stroke-width="4"/>
    <polygon points="0,-18 16,14 -16,14" fill="#ffffff"/>
  </g>
</svg>
